; Emmie Lyn nameplate: shows the name on a CYD 4.0" touchscreen board.
; Pins/drivers taken from Grey-Lancaster/Fishing (env cyd40).
;   pio run -e cyd40 -t upload --upload-port COM8
[platformio]
default_envs = cyd40

[env:cyd40]
platform = espressif32@6.10.0
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    https://github.com/Bodmer/TFT_eSPI.git
build_flags =
    -O2
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DST7796_DRIVER
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=33
    -DSPI_TOUCH_FREQUENCY=2500000
    -DSPI_FREQUENCY=80000000
    -DSPI_READ_FREQUENCY=20000000
    -DUSE_HSPI_PORT
